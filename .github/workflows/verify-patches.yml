name: verify patches

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Patches apply to pinned upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Verify the customization against the pinned upstream
        run: ./scripts/verify-patches.sh

      # This test came with the vendor-re-signing fix and, until this repository moved to a
      # patch-based shape, had no workflow to run it -- upstream's entire pipeline had been
      # deleted in the import commit and nothing replaced it.
      - name: Run the Windows signing filter test
        run: bash build/freecad/package/windows-sign-filter.test.sh
