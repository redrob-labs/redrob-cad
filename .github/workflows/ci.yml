# The gate every pull request into develop and main must pass: upstream's own `cargo xtask ci`
# (fmt, clippy -D warnings, workspace tests, asset attribution, crate layering, wasm check).
# Upstream ships no PR workflow, so this file is ours; it runs the same command a contributor runs.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xtask-ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: cargo xtask ci
        run: cargo xtask ci
