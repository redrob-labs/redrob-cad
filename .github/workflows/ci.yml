# The gate every pull request into develop and main must pass: upstream's own `cargo xtask ci`
# (fmt, clippy -D warnings, workspace tests, asset attribution, crate layering, wasm check).
# Upstream ships no PR workflow, so this file is ours; it runs the same command a contributor runs.
#
# Runs on pull requests only (a push to develop/main is the merge of a PR that already passed).
# A docs-only or version-only PR, and a release/* PR into main (its code passed on develop),
# skips the Rust job; a skipped job still satisfies the required
# check `cargo xtask ci`. The classifier is .github/scripts/ci-changes.py.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # A release/* PR into main carries code that already passed this gate on its develop
          # PRs; its own change is the version bump.
          if [ "$BASE_REF" = "main" ] && [ "${HEAD_REF#release/}" != "$HEAD_REF" ]; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE_SHA" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci-changes.py "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"
          fi

  xtask-ci:
    name: cargo xtask ci
    needs: changes
    # Runs unless the classifier succeeded and said light; a failed classifier never skips the gate.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: cargo xtask ci
        run: cargo xtask ci
