# Release pipeline: a `vX.Y.Z` tag pushed on `main` builds installers for every platform and
# creates or updates the draft GitHub Release "Redrob CAD vX.Y.Z". See docs/releasing.md.
#
# The tag must equal the Cargo.toml version; the version job fails otherwise. The jobs that sign
# (macOS, Windows) and the one that drafts the GitHub Release run in the `release` environment.
# Signing secrets are the redrob-labs organization's (Apple Developer ID certificate + App Store
# Connect API key for notarization). Every secret is optional: missing ones produce unsigned
# artifacts and a warning, never a failed build. A manual dispatch is a dry run: it builds every
# job and drafts nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CADCRAFT_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $v"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### Redrob CAD v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal
    needs: version
    # Standard hosted runner: redrob-labs has no larger macOS runners configured, and a job that
    # names one waits in the queue forever.
    runs-on: macos-latest
    environment: release
    env:
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$CADCRAFT_VERSION"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: packaging/macos/package.sh --arch universal
      - name: Check the disk image window
        run: packaging/macos/dmg/ci-check.sh dist/release/redrob-cad-*-macos-universal.dmg dist/screens
      - name: Keep the disk image screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-macos
          path: dist/screens/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs@<org id>/<repo>@<id>:environment:release); any other name is refused.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          # Windows on ARM: cross-compiled on the x64 runner, so signing and WiX run as above.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      # Plain IDs (not credentials); here so the login step can be skipped when signing is not set up.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$CADCRAFT_VERSION"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -BuildOnly
      # Azure Artifact Signing, authenticated with OpenID Connect: the job's GitHub token is exchanged
      # for an Azure token against the organization's app registration, whose federated credential
      # accepts `repo:redrob-labs@<org id>/*:environment:release`. No client secret exists anywhere.
      # The login comes AFTER the build: GitHub's OIDC token lives minutes, and a login done before
      # a long build left signtool without a usable credential (it then waited on a browser).
      # The secrets below are redrob-labs organization secrets; do not recreate them as repository
      # secrets (a same-named repository secret would override them). All three are plain IDs.
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and package
        shell: pwsh
        env:
          # sign.ps1 reads these three; the credential comes from the `az login` above.
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SkipBuild
      # The branded setup's screens, and a real per-user MSI install and removal. x64 only: the
      # runner cannot run the arm64 build, and x86 installs the same MSI layout.
      - name: Check the installers
        if: matrix.arch == 'x64'
        shell: pwsh
        run: >-
          ./packaging/windows/setup/ci-check.ps1
          -Setup (Get-Item dist/release/*-setup.exe).FullName
          -Msi (Get-Item dist/release/*.msi).FullName
          -Out dist/screens
      - name: Keep the installer screenshots
        if: matrix.arch == 'x64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-windows
          path: dist/screens/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+, Fedora 36+, RHEL 10). See docs/releasing.md.
    runs-on: ${{ matrix.runner }}
    # No `environment: release`: this job signs nothing, so it gets no release secrets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$CADCRAFT_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/redrob-cad$|metainfo|applications'
          ldd target/release/redrob-cad
          python3 -c "import yaml; m = yaml.safe_load(open('packaging/linux/flatpak/ai.redrob.cad.yml')); assert m['id'] == 'ai.redrob.cad'"
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            # Update information is embedded, and the .zsync for delta updates sits beside it.
            # Without APPIMAGE_EXTRACT_AND_RUN: with it, the runtime passes --appimage-* options
            # on to the app (which then tries to open a window) instead of answering them.
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [version, macos, windows, linux]
    # Only a version tag publishes; a manual dispatch stops before this job. Three platforms, all
    # of which must succeed: the Flatpak, web and FreeBSD builds were dropped from the release
    # (2026-10-13) as not worth their build time and flakiness for the people the app is for.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      # Redrob Launcher reads this file from the release to learn that it uses the shared sign-in.
      # It must exist before the checksums so SHA256SUMS.txt lists it.
      - name: Launcher release manifest
        run: packaging/release-manifest.sh artifacts
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * | tee SHA256SUMS.txt
      - name: Check release assets
        run: packaging/check-release-dir.sh artifacts
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="Redrob CAD v$VERSION"
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) and tag again."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
