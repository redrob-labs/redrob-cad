[package]
name = "cadcraft"
description = "Redrob CAD desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "redrob-cad"

[lints]
workspace = true

[[bin]]
name = "redrob-cad"
path = "src/main.rs"

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
