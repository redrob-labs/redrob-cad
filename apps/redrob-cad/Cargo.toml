[package]
name = "redrob-cad"
description = "Redrob CAD desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "redrob-cad"

[lints]
workspace = true

[[bin]]
name = "redrob-cad"
path = "src/main.rs"

[dependencies]
redrob-cad-engine = { workspace = true }
redrob-cad-ui-egui = { workspace = true }
redrob-cad-io = { workspace = true }
redrob-cad-mcp = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The console device flow (connect a Redrob workspace). rustls, Mozilla's root store.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
rfd = { workspace = true }
# The OS interface language on macOS and Windows, which set no LANG for GUI apps.
sys-locale = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
