[package]
name = "redrob-cad-ui-egui"
description = "Redrob CAD user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
redrob-cad-geom = { workspace = true }
redrob-cad-color = { workspace = true }
redrob-cad-doc = { workspace = true }
redrob-cad-render = { workspace = true }
redrob-cad-engine = { workspace = true }
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
